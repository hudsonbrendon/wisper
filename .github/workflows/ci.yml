name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, types, tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Prettier
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test + coverage
        run: pnpm coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libxdo-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # `tauri::generate_context!` embeds the built frontend, so it must exist
      # before any cargo command compiles the crate.
      - name: Build frontend
        run: |
          pnpm install
          pnpm build

      # tauri-build validates that every `externalBin` exists for the target
      # triple at compile time — even for `cargo clippy`/`cargo test`, which don't
      # bundle. CI doesn't build the real `wisper-summarize` sidecar (that happens
      # only in `pnpm tauri build` via before-build.sh, and we keep llama.cpp out
      # of CI), so stage an empty placeholder to satisfy the existence check.
      - name: Stage summarize sidecar placeholder
        run: |
          TRIPLE=$(rustc -Vv | sed -n 's/^host: //p')
          mkdir -p src-tauri/binaries
          touch "src-tauri/binaries/wisper-summarize-${TRIPLE}"

      - name: rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test + coverage
        # Exclude the Tauri runtime setup, IPC command glue, Whisper FFI and the
        # keystroke-injection FFI — they require a real GUI/OS/hardware and can't
        # be meaningfully unit-tested. Coverage reflects the testable core.
        run: >
          cargo llvm-cov --manifest-path src-tauri/Cargo.toml --lib
          --ignore-filename-regex 'src/(lib|commands|stt|inject)\.rs'
          --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./lcov.info
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
