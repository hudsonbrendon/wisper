name: Release

# Build and publish the desktop app for macOS (Apple Silicon + Intel),
# Linux, and Windows whenever a version tag is pushed (e.g. `v0.1.0`).
#
# A dedicated `create-release` job creates the draft release first; the matrix
# build jobs then only UPLOAD their artifacts to it. This avoids the race where
# four concurrent build jobs each try to create the same release (which failed
# with "Resource not accessible by integration"). The release stays a draft for
# manual review/publish — the updater only sees it once published.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Create draft release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = process.env.GITHUB_REF_NAME;
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `OpenWispr ${tag}`,
              body: 'Download the installer for your platform from the assets below.',
              draft: true,
              prerelease: false,
            });
            return data.id;

  publish-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: "--target aarch64-apple-darwin"
            macos_target: "11.0"
          - platform: macos-latest # Intel
            args: "--target x86_64-apple-darwin"
            macos_target: "10.15"
          - platform: ubuntu-22.04
            args: ""
            macos_target: ""
          - platform: windows-latest
            args: ""
            macos_target: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libxdo-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # whisper.cpp uses std::filesystem (needs macOS 10.15+). The `cmake`
          # crate that builds it does NOT read MACOSX_DEPLOYMENT_TARGET, so the
          # CMake var must be set explicitly or the C++ build fails with
          # "'path' is unavailable". Set both: CMAKE_* for the whisper build,
          # MACOSX_* for Tauri's bundle minimum-version.
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}
          CMAKE_OSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}
          # The "OpenWispr Dev" signing identity in tauri.conf.json only exists in
          # the developer's local keychain (it keeps macOS permission grants stable
          # across local rebuilds). CI runners don't have it, so codesign fails with
          # "item could not be found in the keychain". Override to ad-hoc ("-") for
          # release builds — the updater bundles are verified via the minisign key,
          # not the codesignature. (Ignored on Linux/Windows.)
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
