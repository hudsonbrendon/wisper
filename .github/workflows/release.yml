name: Release

# Build and publish the desktop app for macOS (Apple Silicon + Intel),
# Linux, and Windows whenever a version tag is pushed (e.g. `v0.1.0`).
#
# A dedicated `create-release` job creates the draft release first; the matrix
# build jobs then only UPLOAD their artifacts to it. This avoids the race where
# four concurrent build jobs each try to create the same release (which failed
# with "Resource not accessible by integration"). The release stays a draft for
# manual review/publish — the updater only sees it once published.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - uses: actions/checkout@v6

      - name: Create draft release
        id: create-release
        uses: actions/github-script@v9
        with:
          # tauri-action can only upload to a release in the repo it runs in, and
          # it needs to write the updater latest.json with URLs to that same repo.
          # So we stage the build's release HERE (private wisper) and let a later
          # `mirror` job copy everything to the PUBLIC 99labdev/wisper-releases
          # (rewriting latest.json URLs). End users only ever see wisper-releases.
          script: |
            const tag = process.env.GITHUB_REF_NAME;
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Wisper ${tag}`,
              body: 'Download the installer for your platform from the assets below.',
              draft: true,
              prerelease: false,
            });
            return data.id;

  publish-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15 (not macos-latest): we need an image that ships Xcode 26 /
          # the macOS 26 SDK — see the "Select Xcode" step. macos_target is 12.0:
          # the apple-metal Swift bridge pulls a dynamic `libswift_Concurrency.dylib`
          # dependency, and Swift Concurrency only ships in the OS from macOS 12.
          # With a target < 12 the toolchain back-deploys it and bakes the build
          # machine's Xcode path into the binary, so the app aborts at launch on
          # any Mac without that exact Xcode. 12.0 → dyld loads it from the OS
          # shared cache. Keep in sync with tauri.conf.json minimumSystemVersion.
          - platform: macos-15 # Apple Silicon
            args: "--target aarch64-apple-darwin"
            macos_target: "12.0"
            target_triple: "aarch64-apple-darwin"
          - platform: macos-15 # Intel
            args: "--target x86_64-apple-darwin"
            macos_target: "12.0"
            target_triple: "x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
            macos_target: ""
            target_triple: ""
          - platform: windows-latest
            args: ""
            macos_target: ""
            target_triple: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      # apple-metal (pulled in by screencapturekit / meeting transcription) has a
      # Swift bridge that references macOS 26 SDK symbols (MTLSamplerReductionMode,
      # MTLSamplerDescriptor.reductionMode/.lodBias) under `#available(macOS 26)`.
      # They're runtime-gated, but Swift still needs the macOS 26 SDK to COMPILE
      # them. The macos-15 image ships Xcode 26 but defaults to 16.4 (macOS 15
      # SDK), so select 26 explicitly or the build fails with "cannot find
      # 'MTLSamplerReductionMode' in scope".
      - name: Select Xcode 26 (macOS 26 SDK)
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libxdo-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          # Upload to THIS repo's staging release (mirrored to the public repo by
          # the `mirror` job). Default GITHUB_TOKEN is enough — same-repo upload.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Backend config baked into the client bundle. The Supabase URL and the
          # anon key are public by design (they ship in every client), but kept as
          # secrets so the prod values live in one place.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Tells before-build.sh which triple to build the wisper-summarize
          # sidecar for. On the arm64 runner the Intel leg must CROSS-build the
          # sidecar for x86_64, otherwise Tauri's externalBin lookup fails with
          # "resource path binaries/wisper-summarize-x86_64-apple-darwin doesn't
          # exist". Empty on Linux/Windows → the script falls back to the host.
          WISPER_BUILD_TARGET: ${{ matrix.target_triple }}
          # whisper.cpp uses std::filesystem (needs macOS 10.15+). The `cmake`
          # crate that builds it does NOT read MACOSX_DEPLOYMENT_TARGET, so the
          # CMake var must be set explicitly or the C++ build fails with
          # "'path' is unavailable". Set both: CMAKE_* for the whisper build,
          # MACOSX_* for Tauri's bundle minimum-version.
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}
          CMAKE_OSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}
          # The "OpenWispr Dev" signing identity in tauri.conf.json only exists in
          # the developer's local keychain (it keeps macOS permission grants stable
          # across local rebuilds). CI runners don't have it, so codesign fails with
          # "item could not be found in the keychain". Override to ad-hoc ("-") for
          # release builds — the updater bundles are verified via the minisign key,
          # not the codesignature. (Ignored on Linux/Windows.)
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  # Mirror the staged (private) release to the PUBLIC 99labdev/wisper-releases:
  # end users download from there and the updater endpoint points there. We copy
  # every asset, rewrite the updater latest.json URLs from the private repo to
  # the public one, and additionally publish version-less aliases (the site links
  # to stable `/releases/latest/download/<name>` URLs that never change between
  # versions). The versioned originals stay for the updater; the aliases serve
  # the website downloads.
  mirror:
    needs: [create-release, publish-tauri]
    if: ${{ always() && needs.create-release.result == 'success' }}
    runs-on: ubuntu-22.04
    env:
      # Classic PAT with `repo` scope: reads the private staging repo AND writes
      # the public mirror. (The default GITHUB_TOKEN can't reach wisper-releases.)
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      TAG: ${{ github.ref_name }}
      SRC: 99labdev/wisper
      DST: 99labdev/wisper-releases
    steps:
      - name: Download staged assets
        run: |
          set -euo pipefail
          mkdir dl && cd dl
          # Draft-release asset blobs can be briefly unavailable right after
          # upload (GitHub storage eventual-consistency → "BlobNotFound").
          # Retry a few times before giving up.
          for i in 1 2 3 4 5; do
            if gh release download "$TAG" --repo "$SRC" --pattern '*' --clobber; then
              break
            fi
            echo "download attempt $i failed; retrying in 15s..."
            sleep 15
          done
          ls -la

      - name: Rewrite updater latest.json to public URLs
        run: |
          set -euo pipefail
          cd dl
          if [ -f latest.json ]; then
            sed -i 's#/99labdev/wisper/releases/#/99labdev/wisper-releases/releases/#g' latest.json
            echo "--- latest.json ---"; cat latest.json
          fi

      - name: Ensure public draft release exists
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$DST" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$DST" --draft \
              --title "Wisper $TAG" \
              --notes "Download the installer for your platform from the assets below."

      - name: Upload originals + version-less aliases
        run: |
          set -euo pipefail
          cd dl
          shopt -s nullglob
          # 1) Upload every staged asset verbatim (installers, msi, updater
          #    sidecars, and the rewritten latest.json).
          for f in *; do
            [ -f "$f" ] || continue
            gh release upload "$TAG" "$f" --repo "$DST" --clobber
          done
          # 2) Add stable, version-less aliases for the website download buttons.
          alias_for() {
            case "$1" in
              *_aarch64.dmg)    echo Wisper_aarch64.dmg ;;
              *_x64.dmg)        echo Wisper_x64.dmg ;;
              *_x64-setup.exe)  echo Wisper_x64-setup.exe ;;
              *_amd64.AppImage) echo Wisper_amd64.AppImage ;;
              *_amd64.deb)      echo Wisper_amd64.deb ;;
              *.x86_64.rpm)     echo Wisper.x86_64.rpm ;;
              *)                echo "" ;;
            esac
          }
          for f in *; do
            a=$(alias_for "$f"); [ -n "$a" ] || continue
            [ "$f" = "$a" ] && continue
            cp -f "$f" "$a"
            gh release upload "$TAG" "$a" --repo "$DST" --clobber
            echo "alias: $f -> $a"
          done
