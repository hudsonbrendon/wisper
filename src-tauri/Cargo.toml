[workspace]
members = ["wisper-summarize"]

[package]
name = "wisper"
version = "1.0.0"
description = "Open-source, local-first voice dictation desktop app"
authors = ["Hudson Brendon"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wisper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
    "macos-private-api",
    "tray-icon",
    "image-png",
    "protocol-asset",
] }
tauri-plugin-opener = "2"
# OS keychain (macOS Keychain / Windows Credential Manager / Linux Secret
# Service) for the Supabase session token, so the refresh token is never stored
# in plaintext webview localStorage.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.2"
sha2 = "0.11.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
futures-util = "0.3.32"
tokio = { version = "1.52.3", features = ["fs", "io-util"] }
cpal = "0.18.1"
enigo = "0.6.1"
arboard = "3.6.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
# VAD for the live meeting transcription loop. `meeting::live` is compiled on all
# platforms (it's an ungated module), so this must be a cross-platform dep even
# though meetings only run on macOS. The crate vendors libfvad and builds it with
# `cc`, so it compiles on Linux/Windows CI too.
webrtc-vad = "0.4"
tauri-plugin-oauth = "2.0.0"

[target."cfg(target_os = \"macos\")".dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }
libc = "0.2"
# After dictation, resign the overlay panel's key window so keyboard focus
# returns to the app the user dictated into (a trailing Enter then lands in the
# field, not the pill). Needs NSWindow's orderOut/orderFrontRegardless.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWindow"] }
# Metal GPU acceleration for Whisper on Apple Silicon — slashes transcription
# latency vs the CPU build (the default `WhisperContextParameters` then enables
# the GPU via the `_gpu` feature the `metal` feature turns on).
whisper-rs = { version = "0.16.0", features = ["metal"] }
# System-audio capture for meeting transcription on macOS 13.0–14.3. The
# `macos_13_0` feature gates the audio-capture FFI (system audio is 13.0+).
screencapturekit = { version = "8.0.0", features = ["macos_13_0"] }
# Core Audio process-tap capture for meeting transcription on macOS 14.4+
# (`sysaudio::catap`). `coreaudio-sys` provides the aggregate-device + IO-proc
# FFI and all the property/key constants; the newer process-tap symbols
# (`AudioHardwareCreateProcessTap`/`DestroyProcessTap`) and the `CATapDescription`
# Objective-C class are not in its bindings, so `catap` hand-declares those few
# externs and builds the description via the objc2 runtime. `core-foundation`
# builds the aggregate-device CFDictionary; `block2` builds the IO `AudioDeviceIOBlock`.
coreaudio-sys = "0.2.18"
core-foundation = "0.10.1"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSDictionary", "NSUUID", "NSObject"] }
# Lock-free SPSC ring buffer for the CATap real-time IO-proc handoff: the RT
# callback only `push_slice`es into the producer (no lock, no alloc); a consumer
# off the RT thread drains it into the full-take accumulator.
ringbuf = "0.4"

[target."cfg(not(target_os = \"macos\"))".dependencies]
whisper-rs = "0.16.0"

[dev-dependencies]
hound = "3.5.1"

