[package]
name = "openwispr"
version = "1.0.8"
description = "Open-source, local-first voice dictation desktop app"
authors = ["Hudson Brendon"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "openwispr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.2"
sha2 = "0.11.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
futures-util = "0.3.32"
tokio = { version = "1.52.3", features = ["fs", "io-util"] }
cpal = "0.18.1"
enigo = "0.6.1"
arboard = "3.6.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"

[target."cfg(target_os = \"macos\")".dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }
libc = "0.2"
# After dictation, resign the overlay panel's key window so keyboard focus
# returns to the app the user dictated into (a trailing Enter then lands in the
# field, not the pill). Needs NSWindow's orderOut/orderFrontRegardless.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWindow"] }
# Metal GPU acceleration for Whisper on Apple Silicon — slashes transcription
# latency vs the CPU build (the default `WhisperContextParameters` then enables
# the GPU via the `_gpu` feature the `metal` feature turns on).
whisper-rs = { version = "0.16.0", features = ["metal"] }

[target."cfg(not(target_os = \"macos\"))".dependencies]
whisper-rs = "0.16.0"

[dev-dependencies]
hound = "3.5.1"

