[package]
name = "wisper-summarize"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "wisper-summarize"
path = "src/main.rs"

[dependencies]
encoding_rs = "0.8"

[target."cfg(target_os = \"macos\")".dependencies]
llama-cpp-2 = { version = "0.1.150", features = ["metal"] }

[target."cfg(not(target_os = \"macos\"))".dependencies]
llama-cpp-2 = "0.1.150"
